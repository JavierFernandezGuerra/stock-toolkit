[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-toolkit"
version = "0.1.0"
description = "Toolkit modular para extracción, análisis y visualización de datos bursátiles."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Javier Fernández Guerra" }
]
keywords = ["stocks", "finance", "analytics", "cli", "monte carlo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Financial and Insurance Industry"
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "pydantic>=2.4",
    "pydantic-settings>=2.0",
    "typer[all]>=0.12",
    "yfinance>=0.2",
    "matplotlib>=3.8",
    "rich>=13.7",
    "tabulate>=0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.7"
]
viz = [
    "scipy>=1.11"
]

[project.scripts]
stock-toolkit = "stock_toolkit.main:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
select = ["E", "F", "I", "B", "UP"]
line-length = 100
target-version = "py310"

[tool.coverage.run]
source = ["stock_toolkit"]
branch = true

[tool.coverage.report]
show_missing = true

